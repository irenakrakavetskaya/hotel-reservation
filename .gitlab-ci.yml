stages:
  - lint
  - test
  - build
  - deploy

# Avoid duplicate branch + merge request pipelines.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

variables:
  BACKEND_IMAGE: $CI_REGISTRY_IMAGE/backend
  FRONTEND_IMAGE: $CI_REGISTRY_IMAGE/frontend
  # Relative URL: staging and production can share one frontend image when the
  # browser reaches the API on the same host. Override in Settings > CI/CD >
  # Variables if the API lives on another host.
  NEXT_PUBLIC_API_URL: "/v1"
  AUTH_COOKIE_SECURE: "true"

default:
  interruptible: true

# ============================== templates ==============================

# PHP 8.4 with the extensions the app needs (composer:2 ships neither
# pdo_pgsql nor redis, and its PHP version drifts).
.php:
  image: php:8.4-cli-alpine
  variables:
    COMPOSER_ALLOW_SUPERUSER: "1"
    COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.composer-cache"
  cache:
    key:
      prefix: composer
      files:
        - backend/composer.lock
    paths:
      - .composer-cache/
  before_script:
    - apk add --no-cache curl git unzip
    - curl -sSLf -o /usr/local/bin/install-php-extensions https://github.com/mlocati/docker-php-extension-installer/releases/latest/download/install-php-extensions
    - chmod +x /usr/local/bin/install-php-extensions
    - install-php-extensions @composer intl pdo_pgsql zip redis

.node:
  image: node:22-alpine
  cache:
    key:
      prefix: npm
      files:
        - frontend/package-lock.json
    paths:
      - frontend/.npm/

# Always run on the default branch and tags (so builds are gated by tests);
# on other branches and merge requests, only when the area changed.
.backend_rules:
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG'
    - changes:
        - backend/**/*
        - docker/Dockerfile.backend
        - .gitlab-ci.yml

.frontend_rules:
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG'
    - changes:
        - frontend/**/*
        - docker/Dockerfile.frontend
        - .gitlab-ci.yml

# ============================== lint ==============================

lint:backend:
  extends: [.php, .backend_rules]
  stage: lint
  script:
    - cd backend
    - composer install --no-interaction --prefer-dist
    - vendor/bin/php-cs-fixer fix --dry-run --diff
    - vendor/bin/phpstan analyse --no-progress --memory-limit=1G

lint:frontend:
  extends: [.node, .frontend_rules]
  stage: lint
  script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
    - npm run lint
    - npx tsc --noEmit

# ============================== test ==============================

# The concurrency test (docs/IMPLEMENTATION_PLAN.md §9) runs here as part of
# the normal PHPUnit suite — it needs a real Postgres to exercise the
# check_room_count constraint, which is why this job has a Postgres service
# rather than mocking the database.
# No Redis service: the test environment uses cache.adapter.array. Re-add
# `redis:7-alpine` and REDIS_URL if a test needs a real Redis.
test:backend:
  extends: [.php, .backend_rules]
  stage: test
  services:
    - name: postgres:18-alpine
      alias: postgres
  variables:
    APP_ENV: test
    POSTGRES_DB: hotel_reservations
    POSTGRES_USER: hotel
    POSTGRES_PASSWORD: hotel
    POSTGRES_HOST_AUTH_METHOD: trust
    # Base database name: doctrine.yaml adds the "_test" suffix in the test env.
    DATABASE_URL: "postgresql://hotel:hotel@postgres:5432/hotel_reservations?serverVersion=18&charset=utf8"
    JWT_PASSPHRASE: "ci-test-passphrase"
  script:
    - cd backend
    - composer install --no-interaction --prefer-dist
    - php bin/console lexik:jwt:generate-keypair --no-interaction --skip-if-exists
    - php bin/console doctrine:database:create --if-not-exists --env=test
    - php bin/console doctrine:migrations:migrate --no-interaction --env=test
    - mkdir -p var/test-results
    - vendor/bin/phpunit --testdox --log-junit var/test-results/junit.xml
  artifacts:
    when: always
    reports:
      junit: backend/var/test-results/junit.xml

test:frontend:
  extends: [.node, .frontend_rules]
  stage: test
  script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
    - npm test -- --ci

# ============================== build ==============================
# Builds run only on the default branch or on tags — feature branches stop
# at test. Images are tagged with the git tag (on tags) or the short commit
# SHA (on the default branch). `latest` is only moved by default-branch builds.

.build_template:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

build:backend:
  extends: .build_template
  script:
    - TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - docker build -f docker/Dockerfile.backend -t "$BACKEND_IMAGE:$TAG" backend
    - docker push "$BACKEND_IMAGE:$TAG"
    - |
      if [ -z "$CI_COMMIT_TAG" ]; then
        docker tag "$BACKEND_IMAGE:$TAG" "$BACKEND_IMAGE:latest"
        docker push "$BACKEND_IMAGE:latest"
      fi

build:frontend:
  extends: .build_template
  script:
    - TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - >
      docker build -f docker/Dockerfile.frontend
      --build-arg NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL"
      --build-arg AUTH_COOKIE_SECURE="$AUTH_COOKIE_SECURE"
      -t "$FRONTEND_IMAGE:$TAG" frontend
    - docker push "$FRONTEND_IMAGE:$TAG"
    - |
      if [ -z "$CI_COMMIT_TAG" ]; then
        docker tag "$FRONTEND_IMAGE:$TAG" "$FRONTEND_IMAGE:latest"
        docker push "$FRONTEND_IMAGE:latest"
      fi

# ============================== deploy ==============================
# Placeholder deploy scripts — this project's actual deploy target
# (Kubernetes, a plain VM with docker compose, etc.) isn't specified yet.
# Replace the `script:` blocks below with the real mechanism.
#
# Runtime settings the deploy must provide (they are not baked into the images):
#   backend:  APP_ENV=prod, APP_SECRET, DATABASE_URL, REDIS_URL, JWT_PASSPHRASE
#   frontend: AUTH_COOKIE_SECURE=true, API_SERVER_URL, NEXT_PUBLIC_API_URL

.deploy_template:
  stage: deploy
  image: alpine:3.20
  # A newer pipeline must never cancel a deploy that is already running.
  interruptible: false

deploy:staging:
  extends: .deploy_template
  environment:
    name: staging
    url: https://staging.example.com
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - echo "TODO: pull and deploy $BACKEND_IMAGE:$TAG and $FRONTEND_IMAGE:$TAG to staging (APP_ENV=prod)"

deploy:production:
  extends: .deploy_template
  environment:
    name: production
    url: https://example.com
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG'
      when: manual
  script:
    - TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - echo "TODO: pull and deploy $BACKEND_IMAGE:$TAG and $FRONTEND_IMAGE:$TAG to production (APP_ENV=prod)"