parameters:
    app.reports_directory: '%kernel.project_dir%/var/reports'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'

    Redis:
        class: Redis
        factory: ['Symfony\Component\Cache\Adapter\RedisAdapter', 'createConnection']
        arguments: ['%env(REDIS_URL)%']

    App\Infrastructure\Cache\CacheVersionCounter: '@App\Infrastructure\Cache\RedisCacheVersionCounter'

    App\Domain\User\Repository\UserRepository:
        tags: ['doctrine.repository_service']

    App\Domain\Report\Repository\ReportRepository:
        tags: ['doctrine.repository_service']

    App\Domain\Report\Service\ReportFileStorage:
        arguments:
            $directory: '%env(default:app.reports_directory:REPORTS_DIR)%'

    App\Domain\Report\Service\ReportRealtime:
        arguments:
            $url: '%env(CENTRIFUGO_URL)%'
            $apiKey: '%env(CENTRIFUGO_API_KEY)%'
            $tokenSecret: '%env(CENTRIFUGO_TOKEN_SECRET)%'

when@test:
    services:
        App\Infrastructure\Cache\CacheVersionCounter: '@App\Infrastructure\Cache\ArrayCacheVersionCounter'
