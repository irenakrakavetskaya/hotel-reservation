framework:
    secret: '%env(APP_SECRET)%'
    http_method_override: false
    handle_all_throwables: true
    serializer:
        enabled: true
    validation:
        email_validation_mode: html5
    rate_limiter:
        # Per-IP cap on public sign-ups; login is throttled by the security firewall.
        register:
            policy: sliding_window
            limit: 10
            interval: '15 minutes'
    messenger:
        transports:
            scheduler_default: 'sync://'
        routing:
            'Symfony\Component\Console\Messenger\RunCommandMessage': scheduler_default

# Required for WebTestCase/KernelTestCase (self::getContainer(), static::createClient())
# used by every functional test under tests/Functional — without this, the
# "test.service_container" service doesn't exist.
when@test:
    framework:
        test: true
        cache:
            pools:
                # The array app cache is reset between requests, which would hide throttling;
                # AuthThrottlingTest clears this pool before and after each test.
                cache.rate_limiter_test:
                    adapter: cache.adapter.filesystem
                    public: true
        rate_limiter:
            register:
                cache_pool: cache.rate_limiter_test
