framework:
    secret: '%env(APP_SECRET)%'
    http_method_override: false
    handle_all_throwables: true
    serializer:
        enabled: true
    validation:
        email_validation_mode: html5
    messenger:
        transports:
            scheduler_default: 'sync://'
        routing:
            'Symfony\Component\Console\Messenger\RunCommandMessage': scheduler_default

# Required for WebTestCase/KernelTestCase (self::getContainer(), static::createClient())
# used by every functional test under tests/Functional — without this, the
# "test.service_container" service doesn't exist.
when@test:
    framework:
        test: true
