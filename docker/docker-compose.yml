services:
  log-collector:
    image: docker:28.5.2-cli
    entrypoint: ["sh", "/opt/log-collector.sh"]
    restart: unless-stopped
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-docker}
      LOG_MAX_BYTES: ${LOG_MAX_BYTES:-10485760}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker-compose.yml:/project/docker-compose.yml:ro
      - ./log-collector.sh:/opt/log-collector.sh:ro
      - ../logs:/logs

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-8090}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../backend/public:/app/public:ro
    depends_on:
      - backend
      - frontend

  backend:
    image: docker_backend
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    command: ["php-fpm", "-d", "opcache.validate_timestamps=1"]
    environment:
      APP_ENV: dev
      APP_SECRET: ${APP_SECRET:-changeme}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-hotel}:${POSTGRES_PASSWORD:-hotel}@postgres:5432/${POSTGRES_DB:-hotel_reservations}?serverVersion=18&charset=utf8
      REDIS_URL: redis://redis:6379
      MESSENGER_REPORT_TRANSPORT_DSN: amqp://${RABBITMQ_USER:-hotel_app}:${RABBITMQ_PASSWORD:-hotel-dev}@rabbitmq:5672/%2f
      REPORTS_DIR: /app/var/reports
      CENTRIFUGO_URL: http://centrifugo:8000
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY:-local-development-api-key}
      CENTRIFUGO_TOKEN_SECRET: ${CENTRIFUGO_TOKEN_SECRET:-local-development-token-secret-not-for-production}
    volumes:
      - ../backend:/app
      - backend_vendor:/app/vendor
      - reports_data:/app/var/reports:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
  frontend:
    image: docker_frontend
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${HTTP_PORT:-8090}/v1
        AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${HTTP_PORT:-8090}/v1
      API_SERVER_URL: http://nginx/v1
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
    depends_on:
      migrate:
        condition: service_completed_successfully

  migrate:
    image: docker_backend
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    user: root
    command:
      - sh
      - -ec
      - |
        composer install --no-interaction --prefer-dist --no-scripts
        php bin/console cache:clear
        php bin/console doctrine:migrations:migrate --no-interaction
        psql --set=ON_ERROR_STOP=1 --host=postgres --username="$$POSTGRES_USER" --dbname="$$POSTGRES_DB" --file=/opt/seeds/report-reader.sql
        chown -R www-data:www-data /app/var/cache /app/var/log
    environment:
      APP_ENV: dev
      APP_SECRET: ${APP_SECRET:-changeme}
      COMPOSER_ALLOW_SUPERUSER: "1"
      DATABASE_URL: postgresql://${POSTGRES_USER:-hotel}:${POSTGRES_PASSWORD:-hotel}@postgres:5432/${POSTGRES_DB:-hotel_reservations}?serverVersion=18&charset=utf8
      POSTGRES_USER: ${POSTGRES_USER:-hotel}
      PGPASSWORD: ${POSTGRES_PASSWORD:-hotel}
      POSTGRES_DB: ${POSTGRES_DB:-hotel_reservations}
      REPORT_DB_USER: ${REPORT_DB_USER:-report_reader}
      REPORT_DB_PASSWORD: ${REPORT_DB_PASSWORD:-report-reader-dev}
    volumes:
      - ../backend:/app
      - backend_vendor:/app/vendor
      - ./postgres/seeds/report-reader.sql:/opt/seeds/report-reader.sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  scheduler:
    image: docker_scheduler
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    command: php bin/console messenger:consume scheduler_default --time-limit=3600 --memory-limit=128M
    restart: unless-stopped
    environment:
      APP_ENV: dev
      APP_SECRET: ${APP_SECRET:-changeme}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-hotel}:${POSTGRES_PASSWORD:-hotel}@postgres:5432/${POSTGRES_DB:-hotel_reservations}?serverVersion=18&charset=utf8
      REDIS_URL: redis://redis:6379
      MESSENGER_REPORT_TRANSPORT_DSN: amqp://${RABBITMQ_USER:-hotel_app}:${RABBITMQ_PASSWORD:-hotel-dev}@rabbitmq:5672/%2f
      CENTRIFUGO_URL: http://centrifugo:8000
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY:-local-development-api-key}
      CENTRIFUGO_TOKEN_SECRET: ${CENTRIFUGO_TOKEN_SECRET:-local-development-token-secret-not-for-production}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  reports-results:
    image: docker_backend
    command: php bin/console messenger:consume reports_results --time-limit=3600 --memory-limit=128M
    restart: unless-stopped
    environment:
      APP_ENV: dev
      APP_SECRET: ${APP_SECRET:-changeme}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-hotel}:${POSTGRES_PASSWORD:-hotel}@postgres:5432/${POSTGRES_DB:-hotel_reservations}?serverVersion=18&charset=utf8
      MESSENGER_REPORT_TRANSPORT_DSN: amqp://${RABBITMQ_USER:-hotel_app}:${RABBITMQ_PASSWORD:-hotel-dev}@rabbitmq:5672/%2f
      CENTRIFUGO_URL: http://centrifugo:8000
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY:-local-development-api-key}
      CENTRIFUGO_TOKEN_SECRET: ${CENTRIFUGO_TOKEN_SECRET:-local-development-token-secret-not-for-production}
    volumes:
      - ../backend:/app
      - backend_vendor:/app/vendor
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  report-worker:
    image: docker_report_worker
    build:
      context: ../report-worker
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      AMQP_URL: amqp://${RABBITMQ_USER:-hotel_app}:${RABBITMQ_PASSWORD:-hotel-dev}@rabbitmq:5672/
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-hotel_reservations}
      DB_USER: ${REPORT_DB_USER:-report_reader}
      DB_PASSWORD: ${REPORT_DB_PASSWORD:-report-reader-dev}
      HEALTH_ADDR: :8081
      REPORTS_DIR: /data/reports
    volumes:
      - reports_data:/data/reports
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8081/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

  centrifugo:
    image: centrifugo/centrifugo:v6.6.2
    environment:
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_TOKEN_SECRET:-local-development-token-secret-not-for-production}
      CENTRIFUGO_CLIENT_TOKEN_AUDIENCE: centrifugo
      CENTRIFUGO_CLIENT_TOKEN_ISSUER: hotel-reservation
      CENTRIFUGO_CLIENT_ALLOWED_ORIGINS: ${CENTRIFUGO_ALLOWED_ORIGINS:-http://localhost:${HTTP_PORT:-8090}}
      CENTRIFUGO_HTTP_API_KEY: ${CENTRIFUGO_API_KEY:-local-development-api-key}

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-hotel_app}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-hotel-dev}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hotel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hotel}
      POSTGRES_DB: ${POSTGRES_DB:-hotel_reservations}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-hotel} -d ${POSTGRES_DB:-hotel_reservations}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
  backend_vendor:
  reports_data:
  rabbitmq_data:
