services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-8090}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../backend/public:/app/public:ro
    depends_on:
      - backend
      - frontend

  backend:
    image: docker_backend
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    command: ["php-fpm", "-d", "opcache.validate_timestamps=1"]
    environment:
      APP_ENV: dev
      APP_SECRET: ${APP_SECRET:-changeme}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-hotel}:${POSTGRES_PASSWORD:-hotel}@postgres:5432/${POSTGRES_DB:-hotel_reservations}?serverVersion=18&charset=utf8
      REDIS_URL: redis://redis:6379
    volumes:
      - ../backend:/app
      - backend_vendor:/app/vendor
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
  frontend:
    image: docker_frontend
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${HTTP_PORT:-8090}/v1
        AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${HTTP_PORT:-8090}/v1
      API_SERVER_URL: http://nginx/v1
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}

  scheduler:
    image: docker_scheduler
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    command: php bin/console messenger:consume scheduler_default --time-limit=3600 --memory-limit=128M
    environment:
      APP_ENV: dev
      APP_SECRET: ${APP_SECRET:-changeme}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-hotel}:${POSTGRES_PASSWORD:-hotel}@postgres:5432/${POSTGRES_DB:-hotel_reservations}?serverVersion=18&charset=utf8
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hotel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hotel}
      POSTGRES_DB: ${POSTGRES_DB:-hotel_reservations}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hotel}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
  backend_vendor:
