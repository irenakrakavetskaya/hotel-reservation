server {
    listen 80;
    # Re-resolve container IPs so recreating backend/frontend doesn't cause 502s.
    resolver 127.0.0.11 valid=5s;
    set $backend_upstream backend:9000;
    set $frontend_upstream frontend:3000;
    server_name _;

    root /app/public;
    index index.php;

    location /v1/ {
        try_files $uri /index.php$is_args$args;
    }

    # Symfony web profiler (only routed by the app when APP_ENV=dev).
    location ~ ^/(_profiler|_wdt)/ {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param DOCUMENT_ROOT /app/public;
        fastcgi_pass $backend_upstream;
    }

    location ~ \.php$ {
        return 404;
    }

    location / {
        proxy_pass http://$frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
